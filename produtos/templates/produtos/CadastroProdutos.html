{% extends "base_template.html"%}

{% block title %}
<title>Pé Confortável Ltda - Produtos</title>
{% endblock %}

{% block menu %}
<div class="collapse navbar-collapse justify-content-end" id="mynavbar">
    <div class="navbar-nav">
        <a href="{% url 'index' %}" class="nav-link">Início</a>
        <a href="{% url 'produtos:cadastro' %}" class="nav-link">Cadastrar</a>
        <a href="{% url 'produtos:listar' %}" class="nav-link">Listar</a>
    </div>
</div>
{% endblock %}

{% block titulo_pagina %}
{% endblock %}

{% block corpo %}
<div class="container">
    <form name="idFrmCadastrarProdutos"
          action="{% url 'produtos:cadastro' %}"
          method="post">

        {% csrf_token %}

        <div>
            <p class="text-center fs-2 fw-bold">Cadastro Produtos</p>
        </div>


        <div class="form-group mb-3">
            <label for="idNomeProdutos">Nome do Produto</label>
            <input class="form-control bg-light text-dark"
                   type="text"
                   id="idNomeProdutos"
                   name="nome"
                   placeholder="Informe o nome do Produto"
                   maxlength="70"
                   required>
        </div>

        <div class="form-group mb-3">
            <label for="idPrecoCompra">Preço de Compra</label>
            <input class="form-control bg-light text-dark"
                   type="number"
                   step="0.01"
                   id="idPrecoCompra"
                   name="preco_compra"
                   required>
        </div>

        <div class="form-group mb-3">
            <label for="idPrecoVenda">Preço de Venda</label>
            <input class="form-control bg-light text-dark"
                   type="number"
                   step="0.01"
                   id="idPrecoVenda"
                   name="preco_venda"
                   required>
        </div>

        <div class="form-group mb-3">
            <label for="idCor">Cor</label>
            <input class="form-control bg-light text-dark"
                   type="text"
                   id="idCor"
                   name="cor"
                   maxlength="20"
                   required>
        </div>

        <div class="form-group mb-3">
            <label for="idFabricante">Fabricante</label>
            <select class="form-control"
                    id="idFabricante"
                    name="fabricantes"
                    required>

                {% for fabricante in fabricantes %}
                    <option value="{{ fabricante.codigo }}">
                        {{ fabricante.nome }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="form-group my-4 text-center">
            <input type="reset" value="Limpar" class="btn table-bege btn-md">
            <input type="submit" value="Cadastrar" class="btn table-bege btn-md">
        </div>

    </form>
</div>
{% endblock %}

{% block footer %}
{% endblock %}
